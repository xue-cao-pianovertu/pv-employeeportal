<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APV — Portail Étudiant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #f0eee9; color: #1a1a2e; min-height: 100svh; }

/* Header */
.header {
  background: #0d1f3c; color: #fff; padding: 0 20px;
  display: flex; align-items: center; height: 54px; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.header-logo { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.header-logo img { height: 28px; }
.header-logo span {
  font-family: 'Playfair Display', serif; font-size: 13px; color: #c9a84c; letter-spacing: 0.06em;
}
.header-spacer { flex: 1; }
.user-badge { font-size: 12px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.lang-bar { display: flex; gap: 3px; flex-shrink: 0; }
.lang-btn {
  background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 10px;
  font-family: 'DM Sans', sans-serif; font-weight: 600; padding: 3px 7px;
  border-radius: 3px; cursor: pointer; letter-spacing: 0.04em; transition: background 0.15s;
}
.lang-btn.active, .lang-btn:hover { background: #c9a84c; color: #0d1f3c; }
.logout-btn {
  background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.8);
  font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 12px;
  border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.logout-btn:hover { background: rgba(255,255,255,0.15); }

/* Content */
.content { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; }
.page-title {
  font-family: 'Playfair Display', serif; font-size: 22px; color: #0d1f3c; margin-bottom: 20px;
}

/* Card */
.card {
  background: #fff; border-radius: 12px; padding: 20px;
  border: 1px solid #e5e0d8; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px;
}
.card-header {
  background: #0d1f3c; color: #fff; border-radius: 8px 8px 0 0;
  padding: 12px 16px; margin: -20px -20px 16px; font-size: 11px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  display: flex; align-items: center; justify-content: space-between;
}
.card-header .ref { font-family: 'Playfair Display', serif; font-size: 15px; text-transform: none; color: #c9a84c; letter-spacing: 0.04em; }

/* Info grid */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.info-item label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #9ca3af; display: block; margin-bottom: 3px; }
.info-item span { font-size: 14px; color: #1a1a2e; line-height: 1.4; }
.info-full { grid-column: 1 / -1; }

/* Policy button */
.policy-btn {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 1.5px solid #0d1f3c; color: #0d1f3c;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  padding: 11px 18px; border-radius: 9px; cursor: pointer; width: 100%;
  transition: all 0.15s; margin-top: 4px;
}
.policy-btn:hover { background: #0d1f3c; color: #fff; }
.policy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.policy-icon { font-size: 18px; }

/* Signature box */
.sig-box {
  margin-top: 14px;
  border: 1.5px solid #e5e0d8;
  border-radius: 9px;
  overflow: hidden;
  background: #faf9f7;
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sig-box img { max-width: 100%; height: auto; display: block; }
.sig-loading { color: #9ca3af; font-size: 13px; }

/* Loading / error */
.loading { text-align: center; padding: 48px 20px; color: #9ca3af; }
.err { text-align: center; padding: 48px 20px; color: #dc2626; font-size: 14px; }

/* Avail list */
.avail-list { list-style: none; padding: 0; }
.avail-list li { font-size: 13px; color: #374151; padding: 3px 0; }
.avail-list li::before { content: '→ '; color: #c9a84c; font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <img src="/img/logo.png" alt="Piano Vertu">
    <span data-k="headerTitle">Académie Piano Vertu</span>
  </div>
  <div class="header-spacer"></div>
  <span class="user-badge" id="userBadge"></span>
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('zh')">中文</button>
  </div>
  <button class="logout-btn" onclick="logout()" data-k="logout">Déconnexion</button>
</div>

<div class="content">
  <div class="page-title" data-k="pageTitle">Mon inscription</div>
  <div id="mainContent"><div class="loading" data-k="loading">Chargement...</div></div>
</div>

<script>
const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:7072' : '';
const apiUrl = e => `${API_BASE}/api/${e}`;

const LANG = {
  fr: {
    headerTitle: 'Académie Piano Vertu', logout: 'Déconnexion',
    pageTitle: 'Mon inscription', loading: 'Chargement...', errLoad: 'Impossible de charger votre inscription.',
    cardTitle: 'Inscription', registered: 'Inscrit(e) le',
    fFirstName: 'Prénom', fLastName: 'Nom',
    fChildFirst: 'Prénom de l\'élève', fChildLast: 'Nom de l\'élève',
    fEmail: 'Courriel', fPhone: 'Téléphone',
    fEmgName: 'Contact d\'urgence', fEmgPhone: 'Urgence tél.',
    fLang: 'Langue', fInstrument: 'Instrument', fLevel: 'Niveau', fTeacher: 'Prof. souhaité',
    fAvail: 'Disponibilités', fStart: 'Début souhaité',
    viewPolicy: 'Voir la politique de l\'Académie (PDF)',
    openingPdf: 'Ouverture...', policyErr: 'Impossible d\'ouvrir le PDF.',
    policySection: 'Documents',
    piano: 'Piano', violin: 'Violon', theory: 'Théorie musicale',
    beginner: 'Débutant(e)', intermediate: 'Intermédiaire', advanced: 'Avancé(e)',
    langFR: 'Français', langEN: 'English', langZH: '中文',
  },
  en: {
    headerTitle: 'Piano Vertu Academy', logout: 'Log out',
    pageTitle: 'My registration', loading: 'Loading...', errLoad: 'Could not load your registration.',
    cardTitle: 'Registration', registered: 'Registered on',
    fFirstName: 'First name', fLastName: 'Last name',
    fChildFirst: "Child's first name", fChildLast: "Child's last name",
    fEmail: 'Email', fPhone: 'Phone',
    fEmgName: 'Emergency contact', fEmgPhone: 'Emergency phone',
    fLang: 'Language', fInstrument: 'Instrument', fLevel: 'Level', fTeacher: 'Preferred teacher',
    fAvail: 'Availability', fStart: 'Start preference',
    viewPolicy: 'View Academy policy (PDF)',
    openingPdf: 'Opening...', policyErr: 'Could not open PDF.',
    policySection: 'Documents',
    piano: 'Piano', violin: 'Violin', theory: 'Music theory',
    beginner: 'Beginner', intermediate: 'Intermediate', advanced: 'Advanced',
    langFR: 'Français', langEN: 'English', langZH: '中文',
  },
  zh: {
    headerTitle: 'Piano Vertu 音乐学院', logout: '退出',
    pageTitle: '我的注册', loading: '加载中...', errLoad: '无法加载您的注册信息。',
    cardTitle: '注册', registered: '注册于',
    fFirstName: '名', fLastName: '姓',
    fChildFirst: '学生名', fChildLast: '学生姓',
    fEmail: '电子邮件', fPhone: '电话',
    fEmgName: '紧急联系人', fEmgPhone: '紧急电话',
    fLang: '语言', fInstrument: '乐器', fLevel: '级别', fTeacher: '首选教师',
    fAvail: '可用时间', fStart: '期望开始',
    viewPolicy: '查看学院政策（PDF）',
    openingPdf: '打开中...', policyErr: '无法打开PDF。',
    policySection: '文件',
    piano: '钢琴', violin: '小提琴', theory: '乐理',
    beginner: '初学者', intermediate: '中级', advanced: '高级',
    langFR: 'Français', langEN: 'English', langZH: '中文',
  }
};

let currentLang = 'fr';
let registrationData = null;

function t(k) { return LANG[currentLang]?.[k] ?? k; }

function applyLang() {
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    el.textContent = t(k);
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.lang-btn[onclick="setLang('${currentLang}')"]`);
  if (btn) btn.classList.add('active');
  if (registrationData) {
    renderRegistration(registrationData);
    if (registrationData.signature_blob_name) loadSignature(registrationData.signature_blob_name);
  }
}

function setLang(lang) { currentLang = lang; applyLang(); }

// Auth guard
const token = localStorage.getItem('pv_token');
const role  = localStorage.getItem('pv_role');
if (!token || role !== 'student') window.location.replace('/login-apv.html');
document.getElementById('userBadge').textContent = localStorage.getItem('pv_full_name') || '';

function logout() {
  ['pv_token','pv_role','pv_full_name'].forEach(k => localStorage.removeItem(k));
  window.location.replace('/login-apv.html');
}

function authHeaders() {
  return { 'X-Token': `Bearer ${token}`, 'Authorization': `Bearer ${token}` };
}

function fv(v) {
  if (v == null || v === '') return '—';
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v))
    return new Date(v).toLocaleDateString('fr-CA');
  return v;
}

function formatAvail(av) { return av || null; }

function renderRegistration(r) {
  const avail = formatAvail(r.availabilities);
  const regDate = r.created_at ? new Date(r.created_at).toLocaleDateString('fr-CA') : '—';

  const availHtml = avail
    ? `<span style="white-space:pre-wrap;font-size:14px">${avail}</span>`
    : '—';

  const childHtml = (r.child_first_name || r.child_last_name)
    ? `<div class="info-item"><label>${t('fChildFirst')}</label><span>${fv(r.child_first_name)}</span></div>
       <div class="info-item"><label>${t('fChildLast')}</label><span>${fv(r.child_last_name)}</span></div>`
    : '';

  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span>${t('cardTitle')}</span>
        <span class="ref">${r.ref_id}</span>
      </div>
      <div class="info-grid">
        <div class="info-item"><label>${t('fFirstName')}</label><span>${fv(r.student_first_name)}</span></div>
        <div class="info-item"><label>${t('fLastName')}</label><span>${fv(r.student_last_name)}</span></div>
        ${childHtml}
        <div class="info-item"><label>${t('fEmail')}</label><span style="font-size:12px">${fv(r.email)}</span></div>
        <div class="info-item"><label>${t('fPhone')}</label><span>${fv(r.phone)}</span></div>
        <div class="info-item"><label>${t('fEmgName')}</label><span>${fv(r.emergency_contact_name)}</span></div>
        <div class="info-item"><label>${t('fEmgPhone')}</label><span>${fv(r.emergency_contact_phone)}</span></div>
        <div class="info-item"><label>${t('fInstrument')}</label><span>${fv(r.instrument)}</span></div>
        <div class="info-item"><label>${t('fLevel')}</label><span>${fv(r.level)}</span></div>
        <div class="info-item"><label>${t('fLang')}</label><span>${fv(r.language)}</span></div>
        <div class="info-item"><label>${t('fTeacher')}</label><span>${fv(r.preferred_teacher)}</span></div>
        <div class="info-item info-full"><label>${t('fAvail')}</label>${availHtml}</div>
        <div class="info-item info-full"><label>${t('fStart')}</label><span>${fv(r.start_preference)}</span></div>
        <div class="info-item info-full"><label>${t('registered')}</label><span>${regDate}</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span>${t('policySection')}</span></div>
      <button class="policy-btn" id="policyBtn" onclick="openPolicy()">
        <span class="policy-icon">📄</span>
        <span data-k="viewPolicy">${t('viewPolicy')}</span>
      </button>
      ${r.signature_blob_name ? '<div class="sig-box" id="sigBox"><span class="sig-loading">…</span></div>' : ''}
    </div>
  `;
}

const isMobile = () => 'ontouchstart' in window;
let sigSasUrl = null;

async function loadSignature(blobName) {
  const box = document.getElementById('sigBox');
  if (!box || !blobName) return;
  if (sigSasUrl) { box.innerHTML = `<img src="${sigSasUrl}" alt="Signature">`; return; }
  try {
    const res  = await fetch(apiUrl('GetSignatureUrl?blob=' + encodeURIComponent(blobName)));
    const data = await res.json();
    sigSasUrl  = data.url;
    box.innerHTML = `<img src="${sigSasUrl}" alt="Signature">`;
  } catch { box.innerHTML = ''; }
}

async function openPolicy() {
  const btn  = document.getElementById('policyBtn');
  const lang = (registrationData?.language || currentLang).toLowerCase();
  btn.disabled = true;
  btn.querySelector('[data-k]').textContent = t('openingPdf');
  try {
    const res  = await fetch(apiUrl(`GetApvPolicyUrl?lang=${lang}`));
    const data = await res.json();
    const url  = isMobile()
      ? 'https://docs.google.com/viewer?url=' + encodeURIComponent(data.url)
      : data.url;
    window.open(url, '_blank');
  } catch {
    alert(t('policyErr'));
  } finally {
    btn.disabled = false;
    btn.querySelector('[data-k]').textContent = t('viewPolicy');
  }
}

async function load() {
  try {
    const res = await fetch(apiUrl('GetMyAcademyRegistration'), { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    if (res.status === 404) {
      document.getElementById('mainContent').innerHTML = `<div class="err">${t('errLoad')}</div>`;
      return;
    }
    registrationData = await res.json();
    renderRegistration(registrationData);
    if (registrationData.signature_blob_name) loadSignature(registrationData.signature_blob_name);
  } catch {
    document.getElementById('mainContent').innerHTML = `<div class="err">${t('errLoad')}</div>`;
  }
}

applyLang();
load();
</script>
</body>
</html>
